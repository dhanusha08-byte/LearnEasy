
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnEasy - Fruits and Animals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff8e1;
            margin: 0;
        }

        header {
            background: #ff9800;
            color: white;
            padding: 25px;
        }

        h2 {
            color: #388e3c;
            margin-top: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .picture {
            font-size: 60px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #777;
            cursor: default;
        }

        .progress-section {
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
        }

        .progress-bar {
            height: 22px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .back {
            display: inline-block;
            background: #4a90e2;
            color: white;
            padding: 12px 20px;
            margin: 25px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🍎 Fruits and Animals 🐘</h1>
    <p>Learn with Fun!</p>
</header>

<h2>🍓 Learn Fruits</h2>

<div class="progress-section">
    <h3>Fruit Progress</h3>
    <p id="fruitProgressText">0 out of 6 fruits completed (0%)</p>
    <div class="progress-bar">
        <div class="progress-fill" id="fruitProgressFill"></div>
    </div>
</div>

<div class="container" id="fruitContainer"></div>

<h2>🐶 Learn Animals</h2>

<div class="progress-section">
    <h3>Animal Progress</h3>
    <p id="animalProgressText">0 out of 6 animals completed (0%)</p>
    <div class="progress-bar">
        <div class="progress-fill" id="animalProgressFill"></div>
    </div>
</div>

<div class="container" id="animalContainer"></div>

<a href="student-dashboard.html" class="back">
    ⬅ Back to Student Dashboard
</a>

<script>
    const fruits = [
        ["🍎", "Apple"],
        ["🍌", "Banana"],
        ["🥭", "Mango"],
        ["🍊", "Orange"],
        ["🍇", "Grapes"],
        ["🍉", "Watermelon"]
    ];

    const animals = [
        ["🐶", "Dog"],
        ["🐱", "Cat"],
        ["🐘", "Elephant"],
        ["🦁", "Lion"],
        ["🐵", "Monkey"],
        ["🐰", "Rabbit"]
    ];

    const fruitKey = "learnEasyFruitsCompleted";
    const animalKey = "learnEasyAnimalsCompleted";

    function loadCompleted(key) {
        try {
            return JSON.parse(localStorage.getItem(key)) || [];
        } catch (error) {
            return [];
        }
    }

    let completedFruits = loadCompleted(fruitKey);
    let completedAnimals = loadCompleted(animalKey);

    function updateProgress(type) {
        const isFruit = type === "fruit";
        const list = isFruit ? fruits : animals;
        const completed = isFruit ? completedFruits : completedAnimals;

        const count = completed.length;
        const percentage = Math.round((count / list.length) * 100);

        document.getElementById(type + "ProgressText").innerText =
            `${count} out of ${list.length} ${isFruit ? "fruits" : "animals"} completed (${percentage}%)`;

        document.getElementById(type + "ProgressFill").style.width =
            percentage + "%";

        list.forEach(item => {
            const button = document.getElementById(
                type + "-" + item[1]
            );

            if (completed.includes(item[1])) {
                button.innerText = "✓ Completed";
                button.disabled = true;
            }
        });
    }

    function speak(word, type) {
        if (!("speechSynthesis" in window)) {
            alert("Speech is not supported in this browser.");
            return;
        }

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(word);
        speech.lang = "en-US";

        speech.onend = function() {
            if (type === "fruit" && !completedFruits.includes(word)) {
                completedFruits.push(word);
                localStorage.setItem(fruitKey, JSON.stringify(completedFruits));
                updateProgress("fruit");
            }

            if (type === "animal" && !completedAnimals.includes(word)) {
                completedAnimals.push(word);
                localStorage.setItem(animalKey, JSON.stringify(completedAnimals));
                updateProgress("animal");
            }
        };

        window.speechSynthesis.speak(speech);
    }

    function createCards(items, containerId, type) {
        const container = document.getElementById(containerId);

        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";

            const picture = document.createElement("div");
            picture.className = "picture";
            picture.textContent = item[0];

            const name = document.createElement("p");
            name.className = "name";
            name.textContent = item[1];

            const button = document.createElement("button");
            button.id = type + "-" + item[1];
            button.textContent = "🔊 Listen";

            button.addEventListener("click", function() {
                speak(item[1], type);
            });

            card.appendChild(picture);
            card.appendChild(name);
            card.appendChild(button);

            container.appendChild(card);
        });

        updateProgress(type);
    }

    createCards(fruits, "fruitContainer", "fruit");
    createCards(animals, "animalContainer", "animal");
</script>

</body>
</html>
