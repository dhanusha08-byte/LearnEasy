
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnEasy - Alphabets</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            text-align: center;
            margin: 0;
        }

        header {
            background: #4a90e2;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 25px;
        }

        .letters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: 25px auto;
        }

        .letter {
            background: white;
            border-radius: 15px;
            padding: 20px 5px;
            box-shadow: 0 3px 8px #ccc;
            cursor: pointer;
        }

        .letter h2 {
            font-size: 35px;
            color: #4a90e2;
            margin: 5px;
        }

        .letter p {
            font-size: 16px;
        }

        .letter.completed {
            border: 3px solid #22a06b;
            background: #eafff2;
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        .progress-box {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
        }

        .progress-track {
            background: #ddd;
            height: 18px;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: #22a06b;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        @media(max-width: 450px) {
            .letters {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🔤 Learn Alphabets</h1>
    <p>Let's learn A to Z!</p>
</header>

<div class="container">

    <div class="progress-box">
        <h3>Alphabet Progress</h3>
        <p id="progressText">0 of 26 letters completed (0%)</p>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <h2>Click on a letter to learn!</h2>

    <div class="letters" id="letters"></div>

    <h2 id="result">Choose a letter!</h2>

    <button id="completeButton" onclick="completeLetter()" disabled>
        Mark Letter as Completed
    </button>

    <br>

    <button onclick="location.href='student-dashboard.html'">
        🏠 Back to Dashboard
    </button>

</div>

<script>
    const alphabet = [
        ["A", "Apple"], ["B", "Ball"],
        ["C", "Cat"], ["D", "Dog"],
        ["E", "Elephant"], ["F", "Fish"],
        ["G", "Grapes"], ["H", "House"],
        ["I", "Ice cream"], ["J", "Jug"],
        ["K", "Kite"], ["L", "Lion"],
        ["M", "Mango"], ["N", "Nest"],
        ["O", "Orange"], ["P", "Parrot"],
        ["Q", "Queen"], ["R", "Rabbit"],
        ["S", "Sun"], ["T", "Tiger"],
        ["U", "Umbrella"], ["V", "Van"],
        ["W", "Watch"], ["X", "Xylophone"],
        ["Y", "Yak"], ["Z", "Zebra"]
    ];

    const storageKey = "learnEasyAlphabetCompleted";
    let completed = JSON.parse(localStorage.getItem(storageKey) || "[]");
    let selectedLetter = null;

    const container = document.getElementById("letters");

    function updateProgress() {
        const count = completed.length;
        const percentage = Math.round((count / 26) * 100);

        document.getElementById("progressText").innerText =
            `${count} of 26 letters completed (${percentage}%)`;

        document.getElementById("progressFill").style.width =
            percentage + "%";
    }

    function completeLetter() {
        if (!selectedLetter) return;

        if (!completed.includes(selectedLetter)) {
            completed.push(selectedLetter);
            localStorage.setItem(storageKey, JSON.stringify(completed));
        }

        renderLetters();
        updateProgress();

        document.getElementById("completeButton").disabled = true;
        document.getElementById("result").innerText =
            selectedLetter + " completed! Great job! 🎉";
    }

    function renderLetters() {
        container.innerHTML = "";

        alphabet.forEach(item => {
            const card = document.createElement("div");
            card.className = "letter";

            if (completed.includes(item[0])) {
                card.classList.add("completed");
            }

            card.innerHTML = `
                <h2>${item[0]}</h2>
                <p>${item[1]}</p>
                <button type="button">🔊 Listen</button>
            `;

            card.addEventListener("click", () => {
                selectedLetter = item[0];

                document.getElementById("result").innerText =
                    item[0] + " for " + item[1];

                const speech = new SpeechSynthesisUtterance(
                    item[0] + " for " + item[1]
                );

                speechSynthesis.cancel();
                speechSynthesis.speak(speech);

                document.getElementById("completeButton").disabled =
                    completed.includes(item[0]);
            });

            container.appendChild(card);
        });
    }

    renderLetters();
    updateProgress();
</script>

</body>
</html>
