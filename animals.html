
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnEasy - Animal World</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: linear-gradient(135deg, #d9f7ff, #fff1d6);
    min-height: 100vh;
    padding: 20px;
    text-align: center;
}

header {
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 25px;
    box-shadow: 0 4px 12px #00000015;
}

h1 {
    color: #ff8c42;
    font-size: 32px;
}

header p {
    color: #555;
    margin-top: 8px;
}

.back-btn {
    display: inline-block;
    background: #6c63ff;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: bold;
}

.animal-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    max-width: 1100px;
    margin: auto;
}

.animal-card {
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 5px 15px #00000015;
    transition: 0.3s;
}

.animal-card:hover {
    transform: translateY(-6px);
}

.animal-card img {
    width: 100%;
    height: 170px;
    object-fit: contain;
    border-radius: 15px;
}

.animal-card h2 {
    color: #444;
    margin: 12px 0;
}

.sound-btn {
    background: #ff9f43;
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 17px;
    cursor: pointer;
    font-weight: bold;
}

.sound-btn:hover {
    background: #ee8530;
}

#message {
    margin: 20px;
    color: #555;
    font-size: 17px;
    min-height: 25px;
}

footer {
    margin-top: 35px;
    color: #666;
}
</style>
</head>

<body>

<a href="activities.html" class="back-btn">
⬅ Back to Activities
</a>

<header>
    <h1>🐾 Animal World 🐾</h1>
    <p>Let's learn about animals and listen to their sounds!</p>
</header>

<div id="message">
    Click the button to hear an animal! 🔊
</div>

<div class="animal-container">

    <div class="animal-card">
        <img src="images/lion.png" alt="Lion">
        <h2>🦁 Lion</h2>
        <button class="sound-btn" onclick="playSound('Lion')">
            🔊 Hear Sound
        </button>
    </div>

    <div class="animal-card">
        <img src="images/elephant.png" alt="Elephant">
        <h2>🐘 Elephant</h2>
        <button class="sound-btn" onclick="playSound('Elephant')">
            🔊 Hear Sound
        </button>
    </div>

    <div class="animal-card">
        <img src="images/monkey.png" alt="Monkey">
        <h2>🐒 Monkey</h2>
        <button class="sound-btn" onclick="playSound('Monkey')">
            🔊 Hear Sound
        </button>
    </div>

    <div class="animal-card">
        <img src="images/rabbit.png" alt="Rabbit">
        <h2>🐰 Rabbit</h2>
        <button class="sound-btn" onclick="playSound('Rabbit')">
            🔊 Hear Sound
        </button>
    </div>

    <div class="animal-card">
        <img src="images/dog.png" alt="Dog">
        <h2>🐶 Dog</h2>
        <button class="sound-btn" onclick="playSound('Dog')">
            🔊 Hear Sound
        </button>
    </div>

    <div class="animal-card">
        <img src="images/cat.png" alt="Cat">
        <h2>🐱 Cat</h2>
        <button class="sound-btn" onclick="playSound('Cat')">
            🔊 Hear Sound
        </button>
    </div>

</div>

<footer>
    <p>🌈 LearnEasy - Learn, Play and Enjoy! 🌈</p>
</footer>

<script>
function playSound(animal) {

    if (!('speechSynthesis' in window)) {
        document.getElementById("message").textContent =
            "Sorry! Your browser does not support speech.";
        return;
    }

    window.speechSynthesis.cancel();

    const sounds = {
        Lion: "The lion roars",
        Elephant: "The elephant trumpets",
        Monkey: "The monkey chatters",
        Rabbit: "The rabbit squeaks",
        Dog: "The dog barks",
        Cat: "The cat meows"
    };

    const message = document.getElementById("message");

    message.textContent = "🔊 " + animal + "!";

    const speech = new SpeechSynthesisUtterance(
        sounds[animal]
    );

    speech.lang = "en-US";
    speech.rate = 0.8;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
