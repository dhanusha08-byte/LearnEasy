
<!DOCTYPE html>
<html>
<head>
    <title>Student Progress</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4ff;
            text-align: center;
        }
        h1 {
            background: #5b5bd6;
            color: white;
            padding: 25px;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 400px;
            border-radius: 12px;
        }
        .bar {
            background: #5b5bd6;
            height: 18px;
            border-radius: 10px;
        }
        .track {
            background: #ddd;
            border-radius: 10px;
        }
        button {
            background: #5b5bd6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>📊 Student Progress</h1>

<div class="card">
    <h2>👩 Anu</h2>
    <p>Alphabet Learning</p>
    <div class="track">
        <div class="bar" style="width:80%"></div>
    </div>
    <p>80% Completed</p>
</div>

<div class="card">
    <h2>👦 Rahul</h2>
    <p>Number Learning</p>
    <div class="track">
        <div class="bar" style="width:60%"></div>
    </div>
    <p>60% Completed</p>
</div>

<div class="card">
    <h2>👧 Meera</h2>
    <p>Colour Learning</p>
    <div class="track">
        <div class="bar" style="width:90%"></div>
    </div>
    <p>90% Completed</p>
</div>

<br>

<button onclick="location.href='teacher-dashboard.html'">
    Back to Teacher Dashboard
</button>

</body>
</html>
