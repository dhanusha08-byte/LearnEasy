
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnEasy - Shapes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f3e5f5;
        }

        h1 {
            color: #7b1fa2;
            padding: 20px;
        }

        .shapes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .shape {
            font-size: 65px;
        }

        p {
            font-size: 22px;
        }

        a {
            display: inline-block;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>🔺 Learn Shapes</h1>
    <p>Let's learn different shapes!</p>

    <div class="shapes">

        <div class="card">
            <div class="shape">🔴</div>
            <p>Circle</p>
        </div>

        <div class="card">
            <div class="shape">🟥</div>
            <p>Square</p>
        </div>

        <div class="card">
            <div class="shape">🔺</div>
            <p>Triangle</p>
        </div>

        <div class="card">
            <div class="shape">🟦</div>
            <p>Rectangle</p>
        </div>

        <div class="card">
            <div class="shape">⭐</div>
            <p>Star</p>
        </div>

        <div class="card">
            <div class="shape">❤️</div>
            <p>Heart</p>
        </div>

    </div>

    <a href="index.html">⬅ Back to Home</a>

</body>
</html>
