
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnEasy Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 5px 20px #ccd5e5;
        }

        h1 {
            color: #3157a4;
        }

        p {
            color: #666;
        }

        .roles {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .role {
            flex: 1;
            padding: 22px 10px;
            border-radius: 15px;
            border: 2px solid #dce5f5;
            background: #f8faff;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .role:hover, .role.selected {
            background: #dce8ff;
            border: 3px solid #3157a4;
        }

        .emoji {
            display: block;
            font-size: 38px;
            margin-bottom: 12px;
        }

        #nameSection {
            display: none;
            margin-top: 25px;
        }

        #userName {
            width: 100%;
            padding: 13px;
            border: 2px solid #dce5f5;
            border-radius: 10px;
            font-size: 16px;
        }

        #continueBtn {
            margin-top: 25px;
            padding: 13px 35px;
            background: #3157a4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }

        #message {
            color: #d35400;
            margin-top: 15px;
        }

        @media (max-width: 450px) {
            .roles {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome to LearnEasy!</h1>
    <p>Who are you logging in as?</p>

    <div class="roles">

        <button class="role" onclick="selectRole('Student', this)">
            <span class="emoji">🎓</span>
            Student
        </button>

        <button class="role" onclick="selectRole('Parent', this)">
            <span class="emoji">👨‍👩‍👧</span>
            Parent
        </button>

        <button class="role" onclick="selectRole('Teacher', this)">
            <span class="emoji">📚</span>
            Teacher
        </button>

    </div>

    <div id="nameSection">
        <p>Enter your name:</p>
        <input
            type="text"
            id="userName"
            placeholder="Enter your name"
            maxlength="40"
        >
    </div>

    <button id="continueBtn" onclick="continueLogin()">
        Continue →
    </button>

    <p id="message"></p>

</div>

<script>

    let selectedRole = "";

    function selectRole(role, button) {

        selectedRole = role;

        document.querySelectorAll(".role").forEach(function(card) {
            card.classList.remove("selected");
        });

        button.classList.add("selected");

        document.getElementById("nameSection").style.display = "block";

        document.getElementById("message").textContent =
            role + " selected! Enter your name.";

        document.getElementById("userName").focus();
    }

    function continueLogin() {

        if (selectedRole === "") {
            document.getElementById("message").textContent =
                "Please select your role first!";
            return;
        }

        let name = document.getElementById("userName").value.trim();

        if (name === "") {
            document.getElementById("message").textContent =
                "Please enter your name!";
            return;
        }

        sessionStorage.setItem("userRole", selectedRole);
        sessionStorage.setItem("userName", name);

        if (selectedRole === "Student") {

            localStorage.setItem("learnEasyStudentName", name);

            window.location.href = "student-dashboard.html";

        }

        else if (selectedRole === "Teacher") {
            window.location.href = "teacher-dashboard.html";
        }

        else if (selectedRole === "Parent") {
            window.location.href = "parent-dashboard.html";
        }

    }

</script>

</body>
</html>
