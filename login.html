
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnEasy - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eaf3ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
    }

    /* Main Login Box */

    .login-box {
      background: #ffffff;
      padding: 45px 40px;
      border: 2px solid #B8D2EF;
      border-radius: 20px;
      width: 480px;
      max-width: 95%;
      margin: 40px auto;
      text-align: center;
      box-shadow: 0 6px 20px rgba(80, 120, 170, 0.15);
    }

    h1 {
      color: #2563eb;
      font-size: 38px;
      margin-bottom: 25px;
    }

    h3 {
      color: #34445A;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 18px;
      margin-bottom: 12px;
      color: #34445A;
    }

    /* Input and Dropdown */

    input, select {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #b8c8dc;
      border-radius: 10px;
      font-size: 17px;
      background: #f8fbff;
    }

    select {
      margin-top: 15px;
      margin-bottom: 28px;
      cursor: pointer;
    }

    input {
      margin-bottom: 20px;
    }

    /* Continue Button */

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      background: #78A9DC;
      color: #173B60;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5E91C7;
      color: white;
    }

    /* Mobile Responsive */

    @media (max-width: 600px) {
      .login-box {
        width: 100%;
        padding: 30px 22px;
      }

      h1 {
        font-size: 32px;
      }
    }

  </style>
</head>

<body>

  <div class="login-box">

    <h1>LearnEasy</h1>

    <h3>Welcome! Please Login</h3>

    <label for="role">Select Your Role</label>

    <select id="role" onchange="toggleNameField()">
      <option value="">Choose your role</option>
      <option value="Student">Student</option>
      <option value="Teacher">Teacher</option>
      <option value="Parent">Parent</option>
    </select>

    <div id="nameSection" style="display: none;">
      <input
        type="text"
        id="studentName"
        placeholder="Enter Student Name"
      >
    </div>

    <button onclick="login()">Continue</button>

  </div>

  <script>

    function toggleNameField() {

      const role = document.getElementById("role").value;
      const nameSection = document.getElementById("nameSection");
      const studentName = document.getElementById("studentName");

      if (role === "Student") {
        nameSection.style.display = "block";
      } else {
        nameSection.style.display = "none";
        studentName.value = "";
      }

    }

    function login() {

      const role = document.getElementById("role").value;
      const name = document.getElementById("studentName").value.trim();

      if (role === "") {
        alert("Please select your role.");
        return;
      }

      if (role === "Student" && name === "") {
        alert("Please enter your name.");
        return;
      }

      sessionStorage.setItem("userRole", role);

      if (role === "Student") {

        sessionStorage.setItem("userName", name);
        localStorage.setItem("learnEasyStudentName", name);

        window.location.href = "student-dashboard.html";

      } else if (role === "Teacher") {

        window.location.href = "teacher-dashboard.html";

      } else if (role === "Parent") {

        window.location.href = "parent-dashboard.html";

      }

    }

  </script>

</body>
</html>
