<!DOCTYPE html>
<html>
<head>
    <title>Parent Dashboard - LearnEasy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f8;
            margin: 0;
            text-align: center;
        }

        header {
            background: #e879a9;
            color: white;
            padding: 25px;
        }

        .card {
            background: white;
            max-width: 350px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        .card a {
            display: inline-block;
            background: #e879a9;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }

        .logout {
            color: #333;
        }
    </style>
</head>

<body>

<header>
    <h1>Parent Dashboard</h1>
    <p>Welcome to LearnEasy</p>
</header>

<div class="card">
    <h2>📊 Student Progress</h2>
    <p>View your child's learning progress.</p>
    <a href="student-progress.html">View Progress</a>
</div>

<a class="logout" href="login.html">Logout</a>

</body>
</html>
