
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LearnEasy - Fruit Guessing Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff1d6, #ffe0e8);
    text-align: center;
    padding: 20px;
    margin: 0;
}

header {
    background: white;
    padding: 20px;
    border-radius: 20px;
    max-width: 650px;
    margin: auto;
    box-shadow: 0 4px 12px #0002;
}

h1 {
    color: #e67e22;
}

.subtitle {
    color: #666;
}

.game-box {
    background: white;
    max-width: 500px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 5px 15px #0002;
}

.score-board {
    display: flex;
    justify-content: space-around;
    background: #fff4d6;
    padding: 12px;
    border-radius: 15px;
    font-weight: bold;
    color: #8a5500;
}

.progress {
    background: #eee;
    height: 12px;
    border-radius: 20px;
    margin: 20px 0;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #55c78a;
    transition: width 0.3s;
}

.question {
    font-size: 21px;
    color: #444;
    margin: 20px 0;
    font-weight: bold;
}

.fruit-picture {
    font-size: 110px;
    background: #fff7e6;
    border-radius: 25px;
    padding: 20px;
    margin: 20px auto;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.option-btn {
    padding: 15px;
    border: 2px solid #ffc477;
    background: #fffaf2;
    border-radius: 15px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.option-btn:hover:not(:disabled) {
    background: #ffe2b8;
    transform: scale(1.04);
}

.option-btn:disabled {
    cursor: default;
    opacity: 0.9;
}

.correct {
    background: #b8f2cf !important;
    border-color: #27ae60;
}

.wrong {
    background: #ffd1d1 !important;
    border-color: #e74c3c;
}

#feedback {
    font-size: 19px;
    font-weight: bold;
    min-height: 30px;
    margin: 18px 0;
}

.main-btn {
    background: #e67e22;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    margin: 8px;
}

.main-btn:hover {
    background: #cf6d16;
}

#result {
    display: none;
}

.final-emoji {
    font-size: 75px;
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #6c63ff;
    padding: 12px 20px;
    border-radius: 12px;
    margin-top: 15px;
}

footer {
    margin: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🍎 Fruit Guessing Game 🍌</h1>
    <p class="subtitle">Look at the fruit and choose its correct name!</p>
</header>

<div class="game-box">

    <div class="score-board">
        <span>⭐ Score: <span id="score">0</span></span>
        <span>🎯 Question: <span id="questionNumber">1</span>/6</span>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div id="game">

        <div class="question">
            Which fruit is this? 🤔
        </div>

        <div class="fruit-picture" id="fruitPicture">
            🍎
        </div>

        <div class="options" id="options"></div>

        <div id="feedback"></div>

        <button class="main-btn" id="nextBtn"
                onclick="nextQuestion()" hidden>
            Next Question ➡️
        </button>

    </div>

    <div id="result">
        <div class="final-emoji" id="resultEmoji">🏆</div>
        <h2>Game Completed!</h2>
        <h3 id="finalScore"></h3>
        <p id="resultMessage"></p>

        <button class="main-btn" onclick="startGame()">
            🔄 Play Again
        </button>
    </div>

</div>

<a href="activities.html" class="back-btn">
    ⬅ Back to Activities
</a>

<footer>
    🌈 LearnEasy - Learn, Play and Enjoy! 🌈
</footer>

<script>

const fruits = [
    { name: "Apple", emoji: "🍎" },
    { name: "Banana", emoji: "🍌" },
    { name: "Mango", emoji: "🥭" },
    { name: "Grapes", emoji: "🍇" },
    { name: "Orange", emoji: "🍊" },
    { name: "Watermelon", emoji: "🍉" }
];

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function startGame() {

    questions = shuffle(fruits);
    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("score").textContent = score;
    document.getElementById("game").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

function showQuestion() {

    answered = false;

    const fruit = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("fruitPicture").textContent =
        fruit.emoji;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").hidden = true;

    document.getElementById("progress").style.width =
        (currentQuestion / questions.length * 100) + "%";

    const wrongAnswers = shuffle(
        fruits.filter(item => item.name !== fruit.name)
    ).slice(0, 2);

    const options = shuffle([fruit, ...wrongAnswers]);

    const optionsContainer = document.getElementById("options");

    optionsContainer.innerHTML = "";

    options.forEach(option => {

        const button = document.createElement("button");

        button.className = "option-btn";
        button.textContent = option.name;

        button.onclick = () => checkAnswer(
            option.name, button
        );

        optionsContainer.appendChild(button);

    });
}

function checkAnswer(selected, button) {

    if (answered) return;

    answered = true;

    const correct = questions[currentQuestion].name;

    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(btn => {

        btn.disabled = true;

        if (btn.textContent === correct) {
            btn.classList.add("correct");
        }

    });

    if (selected === correct) {

        score++;

        document.getElementById("score").textContent = score;

        document.getElementById("feedback").textContent =
            "🎉 Amazing! Correct Answer!";

        document.getElementById("feedback").style.color =
            "#27ae60";

    } else {

        button.classList.add("wrong");

        document.getElementById("feedback").textContent =
            "😊 Good try! The correct answer is " + correct + ".";

        document.getElementById("feedback").style.color =
            "#e67e22";

    }

    document.getElementById("nextBtn").hidden = false;

    document.getElementById("nextBtn").textContent =
        currentQuestion === 5 ? "See My Result 🏆" : "Next Question ➡️";
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}

function showResult() {

    document.getElementById("game").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("progress").style.width = "100%";

    document.getElementById("finalScore").textContent =
        "Your Score: " + score + " / 6";

    let message = "";
    let emoji = "";

    if (score === 6) {
        message = "Perfect! You are a Fruit Champion!";
        emoji = "🏆";
    } else if (score >= 4) {
        message = "Excellent work! Keep learning!";
        emoji = "🌟";
    } else if (score >= 2) {
        message = "Good effort! You are improving!";
        emoji = "👏";
    } else {
        message = "Nice try! Play again and learn more!";
        emoji = "😊";
    }

    document.getElementById("resultMessage").textContent =
        message;

    document.getElementById("resultEmoji").textContent =
        emoji;
}

startGame();

</script>

</body>
</html>
