
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnEasy - Red Colour</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f0;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #dc2626;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      max-width: 750px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #0002;
    }

    .emoji {
      font-size: 60px;
    }

    button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>❤️ Let's Learn Red Colour!</h1>
  <p>Look around! Can you find things that are red?</p>

  <div class="container">

    <div class="card">
      <div class="emoji">🍎</div>
      <h2>Apple</h2>
    </div>

    <div class="card">
      <div class="emoji">🍓</div>
      <h2>Strawberry</h2>
    </div>

    <div class="card">
      <div class="emoji">🌹</div>
      <h2>Rose</h2>
    </div>

    <div class="card">
      <div class="emoji">🍒</div>
      <h2>Cherry</h2>
    </div>

    <div class="card">
      <div class="emoji">🚒</div>
      <h2>Fire Truck</h2>
    </div>

    <div class="card">
      <div class="emoji">🎈</div>
      <h2>Red Balloon</h2>
    </div>

  </div>

  <button onclick="location.href='activities.html'">
    Back to Activities
  </button>

</body>
</html>
